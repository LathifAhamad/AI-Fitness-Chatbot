<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitBot AI — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00f0ff;
      --violet: #8a2be2;
      --magenta: #ff006e;
      --lime: #39ff14;
      --bg: #06060f;
      --glass: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: #f0f0f5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    canvas#bg { position: fixed; inset: 0; z-index: 0; }
    .bg-glow {
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 { background: rgba(0,240,255,.08); top: -200px; left: -200px; }
    .glow-2 { background: rgba(138,43,226,.08); bottom: -200px; right: -200px; }

    .login-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 1rem;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo .icon { font-size: 3rem; margin-bottom: .5rem; display: block; }
    .login-logo h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-logo p { color: rgba(255,255,255,.45); font-size: .9rem; margin-top: .3rem; }

    .login-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 2rem;
      backdrop-filter: blur(20px);
    }

    /* Tabs */
    .auth-tabs {
      display: flex;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 1.8rem;
    }
    .auth-tab {
      flex: 1;
      padding: .65rem;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: rgba(255,255,255,.45);
      font-family: 'Inter', sans-serif;
      font-size: .9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .25s;
    }
    .auth-tab.active {
      background: rgba(0,240,255,.12);
      color: var(--cyan);
      font-weight: 600;
    }

    /* Form */
    .auth-form { display: none; }
    .auth-form.active { display: block; }

    .form-group { margin-bottom: 1.1rem; }
    .form-group label {
      display: block;
      font-size: .8rem;
      font-weight: 500;
      color: rgba(255,255,255,.5);
      margin-bottom: .4rem;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .form-group input {
      width: 100%;
      padding: .8rem 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: #f0f0f5;
      font-family: 'Inter', sans-serif;
      font-size: .9rem;
      outline: none;
      transition: all .25s;
    }
    .form-group input:focus {
      border-color: rgba(0,240,255,.4);
      background: rgba(0,240,255,.05);
      box-shadow: 0 0 0 3px rgba(0,240,255,.08);
    }
    .form-group input::placeholder { color: rgba(255,255,255,.2); }

    .btn-submit {
      width: 100%;
      padding: .9rem;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: .5rem;
      transition: all .25s;
      position: relative;
      overflow: hidden;
    }
    .btn-submit:hover { opacity: .88; transform: translateY(-1px); box-shadow: 0 8px 30px rgba(0,240,255,.2); }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .divider {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin: 1.2rem 0;
      color: rgba(255,255,255,.2);
      font-size: .8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,.08);
    }

    .btn-guest {
      width: 100%;
      padding: .8rem;
      background: transparent;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      color: rgba(255,255,255,.5);
      font-family: 'Inter', sans-serif;
      font-size: .88rem;
      cursor: pointer;
      transition: all .25s;
    }
    .btn-guest:hover { border-color: rgba(255,255,255,.2); color: rgba(255,255,255,.75); }

    .error-msg {
      display: none;
      background: rgba(255,0,110,.1);
      border: 1px solid rgba(255,0,110,.3);
      color: #ff6b9d;
      border-radius: 8px;
      padding: .7rem 1rem;
      font-size: .85rem;
      margin-bottom: 1rem;
    }
    .error-msg.show { display: block; }

    .success-msg {
      display: none;
      background: rgba(57,255,20,.08);
      border: 1px solid rgba(57,255,20,.25);
      color: #39ff14;
      border-radius: 8px;
      padding: .7rem 1rem;
      font-size: .85rem;
      margin-bottom: 1rem;
    }
    .success-msg.show { display: block; }

    .role-info {
      display: flex;
      gap: .6rem;
      margin-top: 1.5rem;
    }
    .role-badge {
      flex: 1;
      padding: .6rem .4rem;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 10px;
      text-align: center;
      font-size: .72rem;
    }
    .role-badge .rb-icon { font-size: 1.2rem; display: block; margin-bottom: .2rem; }
    .role-badge .rb-name { font-weight: 600; color: rgba(255,255,255,.7); }
    .role-badge .rb-desc { color: rgba(255,255,255,.3); font-size: .65rem; margin-top: .1rem; }

    @media (max-width: 480px) {
      .login-card { padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <div class="login-wrap">
    <div class="login-logo">
      <span class="icon">🤖</span>
      <h1>FitBot AI</h1>
      <p>Your intelligent fitness companion</p>
    </div>

    <div class="login-card">
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
        <button class="auth-tab" onclick="switchTab('signup')">Create Account</button>
      </div>

      <!-- LOGIN FORM -->
      <div class="auth-form active" id="form-login">
        <div class="error-msg" id="login-error"></div>
        <div class="success-msg" id="login-success"></div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="login-username" placeholder="Enter your username" autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password">
        </div>
        <button class="btn-submit" id="login-btn" onclick="doLogin()">Sign In →</button>
        <p style="text-align:center;font-size:.78rem;color:rgba(255,255,255,.3);margin-top:1rem;">
          Default admin: <strong style="color:rgba(0,240,255,.6)">admin</strong> / <strong style="color:rgba(0,240,255,.6)">admin123</strong>
        </p>
      </div>

      <!-- SIGNUP FORM -->
      <div class="auth-form" id="form-signup">
        <div class="error-msg" id="signup-error"></div>
        <div class="success-msg" id="signup-success"></div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="signup-username" placeholder="Choose a username" autocomplete="username">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signup-email" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="Min. 6 characters" autocomplete="new-password">
        </div>
        <button class="btn-submit" id="signup-btn" onclick="doSignup()">Create Account →</button>
      </div>

      <div class="divider">or</div>
      <button class="btn-guest" onclick="continueAsGuest()">👤 Continue as Guest (limited access)</button>

      <!-- Role Info -->
      <div class="role-info">
        <div class="role-badge">
          <span class="rb-icon">👑</span>
          <div class="rb-name">Admin</div>
          <div class="rb-desc">Full control</div>
        </div>
        <div class="role-badge">
          <span class="rb-icon">🏋️</span>
          <div class="rb-name">Client</div>
          <div class="rb-desc">Full features</div>
        </div>
        <div class="role-badge">
          <span class="rb-icon">👤</span>
          <div class="rb-name">Guest</div>
          <div class="rb-desc">Chat + tools</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Particle background
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    resize(); window.addEventListener('resize', resize);
    for (let i = 0; i < 60; i++) {
      particles.push({ x: Math.random()*innerWidth, y: Math.random()*innerHeight, vx: (Math.random()-.5)*.3, vy: (Math.random()-.5)*.3, r: Math.random()*1.5+.5, a: Math.random()*.4+.1 });
    }
    function animate() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x<0) p.x=canvas.width; if (p.x>canvas.width) p.x=0;
        if (p.y<0) p.y=canvas.height; if (p.y>canvas.height) p.y=0;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle = `rgba(0,240,255,${p.a})`; ctx.fill();
      });
      requestAnimationFrame(animate);
    }
    animate();

    // Tab switch
    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='signup')));
      document.getElementById('form-login').classList.toggle('active', tab==='login');
      document.getElementById('form-signup').classList.toggle('active', tab==='signup');
    }

    // Enter key
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (document.getElementById('form-login').classList.contains('active')) doLogin();
      else doSignup();
    });

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg; el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 5000);
    }
    function showSuccess(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg; el.classList.add('show');
    }

    async function doLogin() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      if (!username || !password) return showError('login-error', 'Please fill in all fields');
      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = 'Signing in...';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.error) { showError('login-error', data.error); btn.disabled=false; btn.textContent='Sign In →'; return; }
        localStorage.setItem('fitbot-token', data.token);
        localStorage.setItem('fitbot-user', JSON.stringify({ username: data.username, role: data.role }));
        showSuccess('login-success', `Welcome back, ${data.username}! Redirecting...`);
        setTimeout(() => window.location.href = '/', 800);
      } catch {
        showError('login-error', 'Server error. Please try again.');
        btn.disabled=false; btn.textContent='Sign In →';
      }
    }

    async function doSignup() {
      const username = document.getElementById('signup-username').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      if (!username || !email || !password) return showError('signup-error', 'Please fill in all fields');
      if (password.length < 6) return showError('signup-error', 'Password must be at least 6 characters');
      const btn = document.getElementById('signup-btn');
      btn.disabled = true; btn.textContent = 'Creating account...';
      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (data.error) { showError('signup-error', data.error); btn.disabled=false; btn.textContent='Create Account →'; return; }
        localStorage.setItem('fitbot-token', data.token);
        localStorage.setItem('fitbot-user', JSON.stringify({ username: data.username, role: data.role }));
        showSuccess('signup-success', `Account created! Welcome, ${data.username}! Redirecting...`);
        setTimeout(() => window.location.href = '/', 800);
      } catch {
        showError('signup-error', 'Server error. Please try again.');
        btn.disabled=false; btn.textContent='Create Account →';
      }
    }

    function continueAsGuest() {
      localStorage.setItem('fitbot-token', 'guest');
      localStorage.setItem('fitbot-user', JSON.stringify({ username: 'Guest', role: 'guest' }));
      window.location.href = '/';
    }

    // If already logged in redirect
    const token = localStorage.getItem('fitbot-token');
    if (token && token !== 'guest') {
      fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } })
        .then(r => r.json()).then(d => { if (!d.error) window.location.href = '/'; }).catch(()=>{});
    }
  </script>
</body>
</html>
